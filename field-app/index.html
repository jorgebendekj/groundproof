<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest"><title>GroundProof Field</title>
<style>body{margin:0;font:16px system-ui;background:#0b1220;color:#e6edf7;padding:12px}button,input{font:inherit;padding:12px;margin:4px 0;width:100%;border-radius:8px;border:1px solid #2b3b5c;background:#1b2a47;color:#e6edf7}
.card{background:#131d33;padding:10px;border-radius:8px;margin:8px 0}.mut{color:#8aa0bd;font-size:13px}.ok{color:#2ecc71}</style></head><body>
<h2>GroundProof Field</h2><div id="status" class="mut"></div>
<div id="login"><input id="em" placeholder="email" value="field@example.com"><input id="pw" type="password" placeholder="password" value="demo-field"><button id="go">Sign in</button></div>
<div id="app" hidden><div id="plots"></div><div id="cur" hidden class="card">
 <b id="curname"></b><div class="mut" id="gps">GPS: waiting…</div>
 <input id="photo" type="file" accept="image/*" capture="environment">
 <button id="walk">Start boundary walk</button><button id="send">Capture & save</button></div>
 <h3>Queue <span id="qn"></span></h3><button id="sync">Sync now</button></div>
<script>
const $=s=>document.querySelector(s);let token=localStorage.gpTok||null,cur=null,pos=null,track=[],watch=null;
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const db=new Promise((res,rej)=>{const r=indexedDB.open('gp',1);r.onupgradeneeded=()=>r.result.createObjectStore('q',{autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=rej});
const tx=async(m,f)=>{const d=await db;return new Promise((res,rej)=>{const t=d.transaction('q',m),s=t.objectStore('q'),r=f(s);t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error)})};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(p,o={}){const r=await fetch('/api'+p,{...o,headers:{Authorization:'Bearer '+token,...(o.headers||{})}});if(!r.ok)throw new Error(r.status);return r.json()}
$('#go').onclick=async()=>{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#em').value,password:$('#pw').value})});if(!r.ok)return alert('Login failed');token=(await r.json()).access_token;localStorage.gpTok=token;start()};
async function start(){$('#login').hidden=true;$('#app').hidden=false;try{const ps=await api('/field/plots');localStorage.gpPlots=JSON.stringify(ps)}catch{}
 const ps=JSON.parse(localStorage.gpPlots||'[]');$('#plots').innerHTML=ps.map(p=>`<div class="card"><b>${esc(p.external_id)}</b> <span class="mut">${esc(p.supplier)} · ${esc(p.status)}</span><button data-id="${p.id}" data-n="${esc(p.external_id)}">Open</button></div>`).join('')||'<p class="mut">No plots assigned.</p>';
 document.querySelectorAll('#plots button').forEach(b=>b.onclick=()=>{cur=+b.dataset.id;$('#curname').textContent=b.dataset.n;$('#cur').hidden=false;track=[];navigator.geolocation?.watchPosition(p=>{pos=p;$('#gps').textContent=`GPS ${p.coords.latitude.toFixed(5)}, ${p.coords.longitude.toFixed(5)} ±${p.coords.accuracy.toFixed(0)} m`;if(watch)track.push([p.coords.longitude,p.coords.latitude])},e=>$('#gps').textContent='GPS error: '+e.message,{enableHighAccuracy:true})});
 qn()}
$('#walk').onclick=()=>{watch=!watch;$('#walk').textContent=watch?'Stop boundary walk ('+track.length+' pts)':'Start boundary walk';if(watch)track=[]};
$('#send').onclick=async()=>{const f=$('#photo').files[0];if(!f||!pos)return alert('Need a photo and a GPS fix');
 const meta={lat:pos.coords.latitude,lon:pos.coords.longitude,accuracy_m:pos.coords.accuracy,gps_track:track,device:{ua:navigator.userAgent},captured_at:new Date().toISOString()};
 await tx('readwrite',s=>s.add({plot:cur,meta,blob:f}));qn();sync()};
async function qn(){$('#qn').textContent='('+(await tx('readonly',s=>s.count()))+')'}
async function sync(){if(!navigator.onLine)return;const d=await db;const keys=await tx('readonly',s=>s.getAllKeys());for(const k of keys){const it=await tx('readonly',s=>s.get(k));const fd=new FormData();fd.append('photo',it.blob,'capture.jpg');fd.append('meta',JSON.stringify(it.meta));
 try{await api(`/plots/${it.plot}/captures`,{method:'POST',body:fd});await tx('readwrite',s=>s.delete(k));$('#status').innerHTML='<span class="ok">Synced ✔</span>'}catch(e){$('#status').textContent='Sync failed ('+e.message+'); will retry';break}}qn()}
$('#sync').onclick=sync;addEventListener('online',sync);if(token)start();
</script></body></html>
