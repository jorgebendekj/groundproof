[project]
name = "groundproof-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "sqlalchemy>=2.0", "alembic>=1.13",
  "pydantic>=2.6", "pydantic-settings>=2.2", "pyjwt>=2.8", "bcrypt>=4.1",
  "shapely>=2.0", "pyproj>=3.6", "pyshp>=2.3", "numpy>=1.26", "httpx>=0.27",
  "python-multipart>=0.0.9", "reportlab>=4.0", "cryptography>=42", "mcp>=1.0",
]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10"]
postgres = ["psycopg[binary]>=3.1"]
real = ["openforis-whisp", "pystac-client", "rasterio", "odc-stac", "c2pa-python"]

[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E701", "E702", "E741", "B008", "UP017", "B905"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
